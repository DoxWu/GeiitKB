# ============================================
# GeiIt企业知识库 - nginx 配置（反代模式）
# ============================================
# 作用：
#     1. 提供前端静态资源服务
#     2. SPA 路由回退（所有前端路由指向 index.html）
#     3. 反向代理后端 API（消除 CORS 跨域问题）
#     4. 静态资源缓存优化
#     5. 安全头设置
#
# 反向代理模式说明：
#     前端通过同源 /api/v1/... 访问后端 API，由 nginx 转发到后端服务。
#     优势：
#     - 无 CORS 跨域问题，消除 OPTIONS 预检请求
#     - 浏览器只访问前端域名，不直连后端，解决国产浏览器网络兼容性问题
#     - 服务端转发比浏览器直连海外服务器更稳定
#
# 变量替换：
#     ${BACKEND_URL} 在容器启动时由 start.sh 通过 envsubst 替换为实际后端地址。
#     格式：https://your-backend.up.railway.app（必须包含协议）
# ============================================

server {
    listen 80;
    server_name _;

    # 前端静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------
    # gzip 压缩配置
    # --------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/xhtml+xml
        image/svg+xml;

    # --------------------------------------------
    # API 反向代理（核心配置）
    # --------------------------------------------
    # 作用：将前端同源请求 /api/v1/... 转发到后端服务
    # 好处：
    #   1. 消除 CORS 跨域问题，浏览器无需发送 OPTIONS 预检
    #   2. 浏览器只访问前端域名，不直连后端，解决国产浏览器网络兼容性
    #   3. 服务端转发比浏览器直连海外服务器（Railway）更稳定
    #
    # 转发规则：
    #   前端请求 /api/v1/auth/login → 后端 ${BACKEND_URL}/api/v1/auth/login
    #   proxy_pass 不带 URI（末尾无 /），nginx 会原样传递完整的原始 URI
    # --------------------------------------------
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;

        # 转发必要的请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式传输支持（聊天问答场景必需）
        # 作用：禁用缓冲，让后端响应立即转发给浏览器，实现打字机效果
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 文件上传大小限制（与后端 MAX_UPLOAD_SIZE 一致）
        client_max_body_size 50m;
    }

    # --------------------------------------------
    # 静态资源缓存
    # 作用：带 hash 的静态资源长期缓存，加速页面加载
    # --------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # robots.txt
    location = /robots.txt {
        expires 1h;
        access_log off;
    }

    # --------------------------------------------
    # SPA 路由回退
    # 作用：所有前端路由（/documents, /chat 等）都回退到 index.html
    #       由 React Router 处理客户端路由
    # --------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存（确保用户获取最新版本）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # --------------------------------------------
    # 安全头设置
    # --------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：强制 HTTPS，生产环境生效（Railway 自动 TLS 终止）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Permissions-Policy：禁用不需要的浏览器 API
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # D3-01 内容安全策略（CSP）
    # 作用：限制资源加载来源，防御 XSS 和数据注入攻击
    # 反代模式下 connect-src 只需 'self'（API 走同源 /api/）
    # 保留 *.up.railway.app 用于开发环境直连后端调试
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.up.railway.app wss://*.up.railway.app https://api.geiit.online; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; report-uri /api/csp-report" always;

    # --------------------------------------------
    # 自定义错误页面（回退到 SPA）
    # --------------------------------------------
    error_page 404 /index.html;
}
