# ============================================
# GeiIt企业知识库 - nginx 配置
# ============================================
# 作用：
#     1. 提供前端静态资源服务
#     2. SPA 路由回退（所有前端路由指向 index.html）
#     3. 静态资源缓存优化
#     4. 安全头设置
#
# 说明：
#     前端通过 VITE_API_BASE_URL 环境变量直接访问后端 API（跨域），
#     后端 CORS 配置允许前端域名访问。
#     如需使用 nginx 反向代理，取消下方 /api/ location 注释并配置 BACKEND_URL。
# ============================================

server {
    listen 80;
    server_name _;

    # 前端静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------
    # gzip 压缩配置
    # --------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/xhtml+xml
        image/svg+xml;

    # --------------------------------------------
    # API 反向代理（可选）
    # 取消注释后，前端可通过同源 /api/v1 访问后端
    # 需在 Dockerfile 中添加 envsubst 处理 BACKEND_URL 变量
    # --------------------------------------------
    # location /api/ {
    #     proxy_pass http://BACKEND_URL;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     # SSE 流式传输支持
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 300s;
    #     # 文件上传大小限制
    #     client_max_body_size 50m;
    # }

    # --------------------------------------------
    # 静态资源缓存
    # 作用：带 hash 的静态资源长期缓存，加速页面加载
    # --------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # robots.txt
    location = /robots.txt {
        expires 1h;
        access_log off;
    }

    # --------------------------------------------
    # SPA 路由回退
    # 作用：所有前端路由（/documents, /chat 等）都回退到 index.html
    #       由 React Router 处理客户端路由
    # --------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存（确保用户获取最新版本）
    # 优化2：API 域名预连接通过 index.html 内联 <link rel="preconnect"> 实现
    #       如需 nginx 端 Early Hints（HTTP 103），需升级 nginx 至 1.25+ 并配置 early_hints on
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # --------------------------------------------
    # 安全头设置
    # E4-05: 补全安全头，覆盖 OWASP 推荐的安全响应头
    # --------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：强制 HTTPS，生产环境生效（Railway 自动 TLS 终止）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Permissions-Policy：禁用不需要的浏览器 API
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # D3-01 内容安全策略（CSP）
    # 作用：限制资源加载来源，防御 XSS 和数据注入攻击
    # 说明：
    #   - script-src 'self'：仅允许同源脚本
    #   - style-src 'unsafe-inline'：Tailwind 运行时注入样式需要（生产构建后可收紧）
    #   - connect-src：允许同源和 Railway 后端 API
    #   - img-src data:：允许 base64 图片（如头像占位）
    #   - object-src 'none'：禁止 Flash/Java 等插件
    #   - report-uri（E4-03）：CSP 违规报告发送到后端 /api/csp-report
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.up.railway.app wss://*.up.railway.app; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; report-uri /api/csp-report" always;

    # --------------------------------------------
    # 自定义错误页面（回退到 SPA）
    # --------------------------------------------
    error_page 404 /index.html;
}
