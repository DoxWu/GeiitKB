# ============================================
# GeiIt企业知识库 - nginx 配置
# ============================================
# 作用：
#     1. 提供前端静态资源服务
#     2. SPA 路由回退（所有前端路由指向 index.html）
#     3. 静态资源缓存优化
#     4. 安全头设置
#
# 说明：
#     前端通过 VITE_API_BASE_URL 环境变量直接访问后端 API（跨域），
#     后端 CORS 配置允许前端域名访问。
#     如需使用 nginx 反向代理，取消下方 /api/ location 注释并配置 BACKEND_URL。
# ============================================

server {
    listen 80;
    server_name _;

    # 前端静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------
    # gzip 压缩配置
    # --------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/xhtml+xml
        image/svg+xml;

    # --------------------------------------------
    # API 反向代理（可选）
    # 取消注释后，前端可通过同源 /api/v1 访问后端
    # 需在 Dockerfile 中添加 envsubst 处理 BACKEND_URL 变量
    # --------------------------------------------
    # location /api/ {
    #     proxy_pass http://BACKEND_URL;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     # SSE 流式传输支持
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 300s;
    #     # 文件上传大小限制
    #     client_max_body_size 50m;
    # }

    # --------------------------------------------
    # 静态资源缓存
    # 作用：带 hash 的静态资源长期缓存，加速页面加载
    # --------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # robots.txt
    location = /robots.txt {
        expires 1h;
        access_log off;
    }

    # --------------------------------------------
    # SPA 路由回退
    # 作用：所有前端路由（/documents, /chat 等）都回退到 index.html
    #       由 React Router 处理客户端路由
    # --------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存（确保用户获取最新版本）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # --------------------------------------------
    # 安全头设置
    # --------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------
    # 自定义错误页面（回退到 SPA）
    # --------------------------------------------
    error_page 404 /index.html;
}
