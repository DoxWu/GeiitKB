# ============================================
# Promtail 配置文件（E6-01）
# ============================================
# 作用：
#     Promtail 是 Loki 的日志采集代理，负责从 Docker 容器收集日志，
#     添加标签后发送到 Loki。与 Loki 组成轻量级日志聚合栈。
#
# 采集方式：
#     通过挂载 /var/lib/docker/containers 读取容器 JSON 日志文件，
#     同时挂载 docker.sock 自动发现容器并提取容器名/镜像等元数据作为标签。
#
# 使用方式：
#     由 docker-compose.monitoring.yml 挂载到 Promtail 容器中
#     Promtail 启动后自动扫描所有容器日志并推送到 Loki
#
# 日志查询（Grafana → Loki）：
#     - 查看后端 API 日志：{container_name="kb_qa_api"}
#     - 查看 Celery Worker 日志：{container_name="kb_qa_worker"}
#     - 按服务名过滤：{service="kb_qa_api"}
#     - 按日志级别过滤（生产环境 JSON 日志）：|= "ERROR" or |~ "\"level\":\"error\""
# ============================================

server:
  # Promtail HTTP 服务端口（用于健康检查和指标暴露）
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # 作用：记录每个日志文件的读取位置，Promtail 重启后从上次位置继续读取
  #       避免日志重复采集或遗漏
  filename: /tmp/positions.yaml

clients:
  # Loki 服务地址（使用 Docker 服务名）
  - url: http://loki:3100/loki/api/v1/push
    # 批处理配置：积攒日志后批量发送，减少 HTTP 请求开销
    batchwait: 1s
    batchsize: 1048576  # 1MB

scrape_configs:
  # --------------------------------------------
  # Docker 容器日志采集
  # --------------------------------------------
  - job_name: docker
    # 通过 Docker socket 动态发现容器
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        # 刷新间隔：每 5 秒扫描一次容器列表
        refresh_interval: 5s
        # 过滤器：只采集本项目容器（按名称前缀过滤）
        # 作用：避免采集无关容器日志，减少噪音和存储
        filters:
          - name: name
            values: ["kb_qa_"]

    # 重标注：从 Docker 元数据提取有意义的标签
    relabel_configs:
      # 提取容器名作为 label（去掉前导 /）
      # 作用：在 Loki 中可通过 {container_name="kb_qa_api"} 查询
      - source_labels: ["__meta_docker_container_name"]
        regex: '/(.*)'
        target_label: container_name

      # 提取容器镜像名作为 label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service

      # 提取 compose project 名作为 label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project

      # 提取环境标签（从容器环境变量 ENVIRONMENT 读取）
      # 作用：区分开发/生产环境日志
      - source_labels: ["__meta_docker_container_label_env"]
        target_label: env

    # 日志文件路径（Docker JSON 日志驱动默认路径）
    pipeline_stages:
      # 解析 Docker JSON 日志格式
      # Docker json-file 驱动输出的每行日志为 {"log":"...","stream":"stdout","time":"..."}
      - json:
          expressions:
            stream: stream
            log: log

      # 提取日志流（stdout/stderr）作为标签
      - labels:
          stream:

      # 尝试解析内层 JSON 日志（生产环境 structlog 输出的 JSON 格式）
      # 作用：生产环境日志为嵌套 JSON，解析后可提取 level/event 等字段
      #       开发环境日志为文本格式，解析失败会静默跳过
      - match:
          selector: '{stream="stdout"}'
          stages:
            - json:
                expressions:
                  level: level
                  event: event
                  logger: logger
            - labels:
                level:
                event:
      # 解析失败时静默跳过（开发环境文本日志不受影响）
