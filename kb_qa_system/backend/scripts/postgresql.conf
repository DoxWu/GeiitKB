# ============================================
# GeiIt企业知识库 - PostgreSQL 调优配置（参考文档）
# ============================================
# 适用：512M 内存容器（docker-compose 开发环境）
#
# 部署方式：
#   docker-compose.yml 通过 postgres command 的 -c 参数逐项设置（非挂载此文件）
#   理由：使用 config_file 覆盖会导致 PG 找不到 pg_hba.conf（认证配置），
#         从而启动失败。-c 参数方式保留 Docker 入口点创建的默认配置。
#   此文件仅作为参数说明和参考，实际配置在 docker-compose.yml 的 command 字段。
#
# Railway：托管 PG 不支持 command 覆盖，使用 ALTER SYSTEM 逐项设置
#          （见 RAILWAY_DEPLOYMENT_GUIDE.md 性能调优章节）
#
# 调优原则：
#   - shared_buffers = RAM × 25%（PG 共享缓冲池）
#   - effective_cache_size = RAM × 75%（规划器预估可用缓存，影响索引选择）
#   - work_mem 按并发连接数控制上限（max_connections × work_mem）
#   - random_page_cost SSD 优化为 1.1（默认 4.0 倾向顺序扫描）
# ============================================

# ---------- 内存与缓冲区 ----------
# shared_buffers：PG 共享缓冲池（RAM 的 25%）
# 默认 128MB → 128MB（512M 容器维持，留余量给 OS + 连接 + 后台进程）
shared_buffers = 128MB

# effective_cache_size：查询规划器预估的可用缓存（RAM 的 75%）
# 默认 4GB（虚高）→ 384MB，让规划器更准确地选择索引扫描 vs 顺序扫描
effective_cache_size = 384MB

# work_mem：单查询排序/哈希内存（每连接每操作独立）
# 默认 4MB → 8MB，提升向量检索 ORDER BY 和 GIN 索引构建性能
# 注意：max_connections × work_mem 是潜在内存上限，512M 容器下 8MB 足够安全
work_mem = 8MB

# maintenance_work_mem：VACUUM/CREATE INDEX/REINDEX 内存
# 默认 64MB → 64MB，IVFFlat 索引重建时提升速度
maintenance_work_mem = 64MB

# ---------- 查询规划（SSD 优化）----------
# random_page_cost：随机读代价（SSD 应为 1.1 而非默认 4.0）
# 默认 4.0 → 1.1，让规划器更倾向使用 IVFFlat 向量索引和 GIN 全文索引
random_page_cost = 1.1

# effective_io_concurrency：并发 IO 请求数（SSD 建议 200）
# 默认 1 → 200，提升 SSD 上的 IO 吞吐
effective_io_concurrency = 200

# ---------- WAL 与检查点 ----------
# checkpoint_completion_target：检查点平滑完成比例
# 默认 0.9 → 0.9（已是最佳实践，显式声明）
checkpoint_completion_target = 0.9

# wal_buffers：WAL 日志缓冲区
# 默认 -1（自动 = shared_buffers/32 = 4MB）→ 4MB（显式固定）
wal_buffers = 4MB

# max_wal_size：检查点间最大 WAL 大小
# 默认 1GB → 256MB（512M 容器下减小 WAL 占用）
max_wal_size = 256MB

# ---------- 连接与超时 ----------
# max_connections：最大连接数
# 默认 100 → 50（DB_POOL_SIZE=10 + max_overflow=20 = 30，留 20 余量给 Celery/迁移/管理连接）
max_connections = 50

# idle_in_transaction_session_timeout：事务空闲超时（与 database.py 一致）
# 作用：防止事务长时间空闲占用连接
idle_in_transaction_session_timeout = 60000

# statement_timeout：单语句超时（与 database.py 一致，作为 DB 级兜底）
# 作用：防止慢查询拖垮连接池
statement_timeout = 30000

# ---------- 日志（便于排查慢查询）----------
# log_min_duration_statement：记录执行时间超过指定值（毫秒）的语句
# 默认 -1（不记录）→ 1000（记录 >1s 的慢查询）
log_min_duration_statement = 1000

# log_line_prefix：日志行前缀格式
# %t 时间戳 / %p 进程ID / %u 用户名 / %d 数据库名
log_line_prefix = '%t [%p] %u@%d '

# ---------- pgvector 专项 ----------
# 不在此设置 ivfflat.probes（运行时 SET 更灵活，由 config.IVFFLAT_PROBES 控制）
