# Alembic 配置文件

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板文件
# file_template = %%(rev)s_%%(slug)s

# 时间戳格式
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 数据库 URL（实际从 env.py 中读取环境变量，这里只是占位）
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/kb_qa

# 是否启用异步
# asyncio = true

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
