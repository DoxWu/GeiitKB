# ============================================
# GeiIt企业知识库 - Dependabot 依赖漏洞扫描配置
# ============================================
# 作用：
#   自动扫描 pip 和 npm 依赖的已知漏洞，
#   每周创建 PR 更新有漏洞的依赖。
#
# E4-01: 依赖漏洞自动扫描
# ============================================

version: 2

updates:
  # Python 后端依赖
  - package-ecosystem: "pip"
    directory: "/kb_qa_system/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "geiit-team"

  # npm 前端依赖
  - package-ecosystem: "npm"
    directory: "/kb_qa_system/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "geiit-team"

  # GitHub Actions 依赖
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
